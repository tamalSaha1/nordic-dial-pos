<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nordic Dial - Login</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Nordic Dial</h1>
      <p class="subtitle">Inventory & Billing POS - sign in to continue</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@nordicdial.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="loginBtn">Sign In</button>
      </form>

      <div class="demo-hint">
        <strong>Demo accounts (after running <code>npm run seed</code>):</strong><br/>
        Manager: manager@nordicdial.com / Manager@123<br/>
        Staff: staff@nordicdial.com / Staff@123<br/>
        Role and permissions are decided by the account, not by anything typed here.
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // If already logged in, skip straight to dashboard
    if (localStorage.getItem('kl_token')) {
      window.location.href = '/dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const data = await api.post('/auth/login', { email, password });

        localStorage.setItem('kl_token', data.token);
        localStorage.setItem('kl_user', JSON.stringify(data.user));

        window.location.href = '/dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message || 'Login failed';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
