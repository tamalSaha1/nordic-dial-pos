<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports - Nordic Dial</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <h1>Reports & Revenue</h1>
        <div class="flex">
          <select id="periodSelect">
            <option value="daily">Today</option>
            <option value="weekly">Last 7 Days</option>
            <option value="monthly">Last 30 Days</option>
          </select>
          <button class="btn btn-secondary" onclick="window.print()">Export / Print</button>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value" id="rRevenue">-</div></div>
        <div class="stat-card"><div class="stat-label">Orders</div><div class="stat-value" id="rOrders">-</div></div>
        <div class="stat-card"><div class="stat-label">Avg Order Value</div><div class="stat-value" id="rAvg">-</div></div>
        <div class="stat-card"><div class="stat-label">Stock Value</div><div class="stat-value" id="rStockValue">-</div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
        <div class="card">
          <strong>Revenue Trend</strong>
          <table class="mb-16" style="margin-top:12px">
            <thead><tr><th>Date</th><th>Revenue</th></tr></thead>
            <tbody id="trendBody"><tr><td colspan="2" class="text-muted">Loading...</td></tr></tbody>
          </table>
        </div>

        <div class="card">
          <strong>Best-Selling Items</strong>
          <table class="mb-16" style="margin-top:12px">
            <thead><tr><th>Product</th><th>Units Sold</th><th>Revenue</th></tr></thead>
            <tbody id="bestSellersBody"><tr><td colspan="3" class="text-muted">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script>
    const session = requireAuth('/reports.html');
    requireManager(session);

    async function loadRevenue() {
      const period = document.getElementById('periodSelect').value;
      const revenue = await api.get(`/reports/revenue?period=${period}`);

      document.getElementById('rRevenue').textContent = formatMoney(revenue.totalRevenue);
      document.getElementById('rOrders').textContent = revenue.totalOrders;
      document.getElementById('rAvg').textContent = formatMoney(revenue.avgOrderValue);

      const trendBody = document.getElementById('trendBody');
      trendBody.innerHTML = revenue.trend.length
        ? revenue.trend.map(t => `<tr><td>${t.date}</td><td>${formatMoney(t.revenue)}</td></tr>`).join('')
        : '<tr><td colspan="2" class="empty-state">No sales in this period.</td></tr>';
    }

    async function loadStockSummary() {
      const summary = await api.get('/reports/stock-summary');
      document.getElementById('rStockValue').textContent = formatMoney(summary.totalStockValue);
    }

    async function loadBestSellers() {
      const items = await api.get('/reports/best-sellers?limit=10');
      const body = document.getElementById('bestSellersBody');
      body.innerHTML = items.length
        ? items.map(i => `<tr><td>${i.name}</td><td>${i.unitsSold}</td><td>${formatMoney(i.revenue)}</td></tr>`).join('')
        : '<tr><td colspan="3" class="empty-state">No sales recorded yet.</td></tr>';
    }

    document.getElementById('periodSelect').addEventListener('change', loadRevenue);

    loadRevenue();
    loadStockSummary();
    loadBestSellers();
  </script>
</body>
</html>
